 if(!p){$('#main').innerHTML=`<div class="empty">${PEOPLE.length?'Ya viste a todos por ahora 🎉':'Todavía no hay otras personas registradas.'}<br>Invitá a tus conocidos para seguir calificando.</div><button class="btn" onclick="inviteContacts()">Invitar desde mis contactos</button><button class="btn alt" onclick="shareApp()">${ic('share')} Invitar por WhatsApp</button>${SK.size?'<button class="btn line" onclick="SK.clear();render()">Volver a ver los salteados</button>':''}`;return}
 $('#main').innerHTML=`<p style="text-align:center;color:var(--mut);font-size:13px;margin:0 0 10px">${q.length} para calificar · deslizá ← para saltar (no calificás) · → para calificar con detalle</p>
 <div class="card sc" id="sc" style="touch-action:pan-y;user-select:none;transition:transform .25s,opacity .25s">
 ${p.avatar_url?`<img class="hero" src="${esc(p.avatar_url)}" referrerpolicy="no-referrer" alt="" draggable="false">`:`<div class="hero" style="background:${hc(p.id)}">${ini(p.name)}</div>`}
 <div class="stamp st-l">SALTAR<small>no calificás</small></div><div class="stamp st-r">CALIFICAR<small>con detalle</small></div>
 <div class="info"><h3 style="margin:0 0 2px">${esc(p.name)}</h3><span style="color:var(--mut)">${esc(p.trait||'Sin frase todavía')}</span>
 <div style="margin:8px 0;font-weight:700">${p.refs?'★ '+p.rating.toFixed(1)+' · '+p.refs+' referencias':'Sé el primero en calificar ✨'}</div>
 <div class="tags" style="justify-content:center">${Object.entries(REL).map(r=>`<button class="chip ${Q.rel===r[0]?'on':''}" onclick="Q.rel='${r[0]}';rr()">${r[1]}</button>`).join('')}</div>
 <div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="qrate(${n})" aria-label="${n} estrellas">${ic('star')}</button>`).join('')}</div>
 <p style="color:var(--mut);font-size:13px;margin:8px 0 0">Tocá una estrella para calificar</p></div></div>
 <div class="acts"><div><button class="round" onclick="fly(-1,'skip')" aria-label="Saltar">${ic('x')}</button>No calificar</div><div><button class="round" onclick="openPerson('${p.id}')" aria-label="Ver perfil">${ic('user')}</button>Ver perfil</div><div><button class="round" onclick="fly(1,'rate')" aria-label="Calificar con detalle">${ic('pen')}</button>Con detalle</div></div>
 <div class="card sw"><div><b>Calificar de forma anónima</b><small>Tu nombre no se mostrará a otros usuarios</small></div><button class="tg ${Q.anon?'on':''}" onclick="Q.anon=!Q.anon;rr()" aria-label="Anónimo"></button></div>
 <button class="btn alt" onclick="inviteContacts()">Invitar desde mis contactos</button>`;swipeInit()}
function swipeInit(){const c=$('#sc');if(!c)return;let x0=null,dx=0;
 c.onpointerdown=e=>{if(e.target.closest('button'))return;x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 const L=c.querySelector('.st-l'),Rr=c.querySelector('.st-r');
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;L.style.opacity=Math.min(Math.max(-dx,0)/110,1);Rr.style.opacity=Math.min(Math.max(dx,0)/110,1)};
 c.onpointerup=c.onpointercancel=()=>{if(x0===null)return;x0=null;c.style.transition='';if(dx>110)fly(1,'rate');else if(dx<-110)fly(-1,'skip');else{c.style.transform='';L.style.opacity=Rr.style.opacity=0}dx=0}}
function fly(d,act){const c=$('#sc'),p=queue()[0];if(!p)return;if(c){const t=c.querySelector(d>0?'.st-r':'.st-l');if(t&&act!=='done')t.style.opacity=1;c.style.transform=`translateX(${d*480}px) rotate(${d*22}deg)`;c.style.opacity=0}
 setTimeout(()=>{if(act==='rate'){openPerson(p.id);startRate()}else{if(act==='skip'){SK.add(p.id);toast('Saltaste a '+p.name.split(' ')[0]+' · no se envió calificación')}render()}},230)}
async function qrate(n){const p=queue()[0];if(!p||BUSY)return;BUSY=true;
 const {error}=await sb.from('reviews').insert({person_id:p.id,relation:Q.rel,stars:n,tags:[],comment_id:null,anonymous:Q.anon});BUSY=false;
 if(error)return toast(error.code==='23505'?'Ya calificaste a esta persona en esa relación':'No se pudo enviar. Probá de nuevo');
 S.mine=(S.mine||[]).concat({person_id:p.id,relation:Q.rel,stars:n});toast('¡Enviado! '+'★'.repeat(n));fly(1,'done');refresh()}
// ---------- CONTACTOS (Android/Chrome) ----------
async function inviteContacts(){
 if(!(navigator.contacts&&navigator.contacts.select)){toast('Este navegador no deja leer contactos');return shareApp()}
 try{const c=await navigator.contacts.select(['name','tel'],{multiple:true}),x=c.filter(k=>k.tel&&k.tel[0]);if(!x.length)return;
  const d=document.createElement('div');d.className='sheet';d.onclick=e=>{if(e.target===d)d.remove()};
  d.innerHTML=`<div class="legalbox"><div class="lhead"><h3>Invitá a tus contactos</h3><button class="round" onclick="this.closest('.sheet').remove()" aria-label="Cerrar">✕</button></div><div class="lbody">${x.map(k=>`<button class="opt" onclick="waInv('${esc(k.tel[0])}')">${esc((k.name&&k.name[0])||k.tel[0])} · enviar por WhatsApp</button>`).join('')}</div></div>`;document.body.appendChild(d)}catch(e){}}
function waInv(t){let n=t.replace(/\D/g,'');if(!t.trim().startsWith('+'))n='54'+n.replace(/^0+/,'');window.open('https://wa.me/'+n+'?text='+encodeURIComponent('Sumate a Rankea Gente, entrás con Google en un toque '+location.origin+location.pathname),'_blank')}
// ---------- CARTELITO DE INTRO (5 s) ----------
function intro(){const k='ref_intro'+(U?1:0);try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
 const w=document.createElement('div');w.className='introw',nm=U&&((U.user_metadata&&U.user_metadata.full_name)||'').split(' ')[0];
 w.onclick=e=>{if(e.target===w)w.remove()};
 w.innerHTML=U?`<div class="intro"><b>${nm?'¡Hola, '+esc(nm)+'!':'¡Bienvenido/a!'} 👋</b><span>Pedile a tus conocidos que te califiquen. Les lleva 1 minuto y las referencias quedan en tu perfil.</span><button class="wa" onclick="this.closest('.introw').remove();askRef(true)">Pedir que me califiquen por WhatsApp</button><button class="later" onclick="this.closest('.introw').remove()">Más tarde</button><div class="bar"><i></i></div></div>`:`<div class="intro"><b>Tu reputación, contada por quienes te conocen.</b><span>Rankea Gente: da y recibí referencias reales de trabajo, amistad o pareja. Gratis.</span><div class="bar"><i></i></div></div>`;
 document.body.appendChild(w);setTimeout(()=>w.remove(),5000)}

// ---------- PERFIL DE OTRA PERSONA ----------
async function openPerson(id){S.pid=id;S.view='person';S.data=null;render();scrollTo(0,0);
 const [r,mine]=await Promise.all([sb.from('reviews_public').select('*').eq('person_id',id).order('created_at',{ascending:false}),sb.from('reviews').select('relation').eq('person_id',id)]);
 const rows=r.data||[],ids=[...new Set(rows.map(x=>x.author_id).filter(Boolean))],names={};
 if(ids.length){const q=await sb.from('profiles').select('id,name').in('id',ids);(q.data||[]).forEach(x=>names[x.id]=x.name)}
 S.data={rows,names,done:(mine.data||[]).map(x=>x.relation)};if(S.pid===id&&S.view==='person')render()}
function person(){
 const p=find(S.pid);if(!p){S.view='search';return render()}
 const d=S.data,f=FAVS.has(p.id);
 $('#top').innerHTML=`${back('search')}<h2>Perfil</h2><button class="round" onclick="share()" aria-label="Compartir">${ic('share')}</button>`;
 let tops='',body='<div class="empty">Cargando comentarios…</div>';
 if(d){const c={};d.rows.forEach(r=>(r.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));const t=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4),mx=t[0]?t[0][1]:1;
  tops=t.length?`<div class="card"><div class="lab">Lo que más destacan</div><div class="bars">${t.map(x=>`<div class="bar"><span>${x[0]}</span><div><i style="width:${Math.max(12,x[1]/mx*100)}%"></i></div><b>${x[1]}</b></div>`).join('')}</div></div>`:'';
  body=d.rows.length?d.rows.map(r=>`<div class="card rev"><small>${REL[r.relation]} · ${r.author_id?esc(d.names[r.author_id]||'Usuario'):'Anónimo'} · ${'★'.repeat(r.stars)}</small>${r.comment?`<p>“${esc(r.comment)}”</p>`:''}</div>`).join(''):'<div class="empty">Aún no hay comentarios. ¡Sé el primero!</div>'}
 $('#main').innerHTML=`<div class="hdr">${av(p,'lg')}<h3>${esc(p.name)}</h3><span style="color:var(--mut)">${esc(p.trait||'')}</span>${p.verified?`<span class="seal">${ic('check')} Verificado</span>`:''}</div>
 <div class="card stats"><div><b>${p.refs?p.rating.toFixed(1)+' ★':'–'}</b><span>Promedio</span></div><div><b>${p.refs}</b><span>Referencias</span></div><div><b>${d?d.done.length:'–'}</b><span>Tuyas</span></div></div>${tops}
 <div class="lab" style="margin-top:6px">Comentarios</div>${body}
 <div class="stick" style="display:flex;gap:10px"><button class="btn" onclick="startRate()">${ic('pen')} Calificar</button><button class="round" style="width:52px;height:52px;flex-shrink:0;${f?'color:var(--acc)':''}" onclick="fav('${p.id}')">${ic('heart')}</button></div>`}
function shareApp(t){const u=location.origin+location.pathname+'#app',x=t||'Sumate a Rankea Gente, entrás con Google en un toque';if(navigator.share&&!wa)navigator.share({title:'Rankea Gente',text:x,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(x+' '+u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}}
function share(){const p=find(S.pid);shareApp(`Mirá las referencias de ${p.name} en Rankea Gente`)}

// ---------- CALIFICAR ----------
function startRate(){R={rel:'trabajo',stars:0,tags:{},cm:-1,own:'',anon:false};go('rate')}
function rate(){
 const p=find(S.pid);if(!p||!R)return go('search');
 $('#top').innerHTML=`${back('person')}<h2>Calificá a ${esc(p.name.split(' ')[0])}</h2><span style="width:40px"></span>`;
 const done=S.data?S.data.done.includes(R.rel):false,cs=CM.map((c,i)=>[c,i]).filter(x=>x[0][0]===R.rel);
 $('#main').innerHTML=`<p style="color:var(--mut);font-size:13px;text-align:center;margin:0 0 4px">⏱ Te toma 20 segundos · solo las estrellas son obligatorias</p><div class="card"><div class="lab">¿Qué relación tienen?</div><div class="tags">${Object.entries(REL).map(r=>`<button class="chip ${R.rel===r[0]?'on':''}" onclick="R.rel='${r[0]}';R.cm=-1;rr()">${r[1]}</button>`).join('')}</div>${done?'<p style="color:var(--warn);font-size:13px;margin-top:10px">Ya calificaste a esta persona en esta relación. Elegí otra.</p>':''}</div>
 <div class="card"><div class="lab">Tu puntuación</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${R.stars>=n?'on':''}" onclick="R.stars=${n};rr()" aria-label="${n} estrellas">${ic('star')}</button>`).join('')}</div><p style="text-align:center;color:var(--mut);font-size:13px;margin-top:6px">${['Tocá una estrella','Muy malo','Malo','Regular','Bueno','Excelente'][R.stars]}</p></div>
 ${(()=>{const sl=R.tags.all||[],all=Object.values(TAGS).flat(),pop=['Responsable','Puntual','De confianza','Honesto','Colaborativo','Resolutivo','Leal','Divertido'],show=R.more?all:[...new Set([...pop,...sl])];return`<div class="card"><div class="lab">¿Cómo es? <span>elegí hasta ${MAXT} · ${sl.length}/${MAXT}</span></div><div class="tags">${show.map(x=>`<button class="chip ${sl.includes(x)?'sel':''}" onclick="tg('${x}')">${sl.includes(x)?'✓ ':''}${x}</button>`).join('')}${R.more?'':`<button class="chip" onclick="R.more=true;rr()">Ver más…</button>`}</div></div>`})()}
 <div class="card"><div class="lab">Comentario<span>opcional</span></div>${cs.map(x=>`<button class="opt ${R.cm===x[1]?'on':''}" onclick="R.cm=R.cm===${x[1]}?-1:${x[1]};rr()">${x[0][1]}</button>`).join('')}</div>
 <div class="card sw"><div><b>Calificar de forma anónima</b><small>Tu nombre no se mostrará a otros usuarios</small></div><button class="tg ${R.anon?'on':''}" onclick="R.anon=!R.anon;rr()" aria-label="Anónimo"></button></div>
 <div class="stick"><button class="btn" onclick="send()">Enviar calificación</button></div>`}
const MAXT=5;
function tg(x){const a=R.tags.all=R.tags.all||[],i=a.indexOf(x);if(i>=0)a.splice(i,1);else if(a.length<MAXT)a.push(x);else toast('Máximo '+MAXT+' etiquetas');rr()}
async function send(){
 if(!R.stars)return toast('Elegí una puntuación');
 if(S.data&&S.data.done.includes(R.rel))return toast('Ya calificaste en esa relación');
 if(BUSY)return;BUSY=true;
 const {error}=await sb.from('reviews').insert({person_id:S.pid,relation:R.rel,stars:R.stars,tags:Object.values(R.tags).flat(),comment_id:R.cm>=0?R.cm:null,anonymous:R.anon});
 BUSY=false;
 if(error)return toast(error.code==='23505'?'Ya calificaste a esta persona en esa relación':'No se pudo enviar. Probá de nuevo');
 toast('¡Gracias! Calificación enviada');const rated=new Set((S.mine||[]).map(x=>x.person_id));rated.add(S.pid);S.mine=null;await refresh();openPerson(S.pid);loadMine();thanks(rated)}

// ---------- MI PERFIL ----------
async function loadMine(){const r=await sb.from('reviews').select('person_id,relation,stars,comment_id').order('created_at',{ascending:false});S.mine=r.data||[];if(S.view==='me'||(S.view==='search'&&!S.q)||S.view==='swipe')render()}
async function saveTrait(){const t=$('#tr').value.trim().slice(0,60),r=await sb.from('profiles').update({trait:t}).eq('id',U.id);if(r.error)return toast('No se pudo guardar');ME.trait=t;toast('Guardado')}
function me(){
 $('#top').innerHTML=`<h2>Mi perfil</h2>${tbtn}`;if(!S.mine)loadMine();
 const m=ME||{},sent=S.mine||[];
 $('#main').innerHTML=`<div class="hdr">${av(m,'lg')}<h3>${esc(m.name||'')}</h3><span style="color:var(--mut)">${esc(U.email||'')}</span></div>
 <div class="card stats"><div><b>${m.refs?(+m.rating).toFixed(1)+' ★':'–'}</b><span>Mi promedio</span></div><div><b>${m.refs||0}</b><span>Recibidas</span></div><div><b>${S.mine?sent.length:'–'}</b><span>Enviadas</span></div></div>
 ${prog()}<div class="card"><div class="lab">Tu frase en el perfil</div><input id="tr" maxlength="60" placeholder="Ej: Diseñador responsable y buena onda" value="${esc(m.trait||'')}"><button class="btn alt" style="margin-top:10px" onclick="saveTrait()">Guardar</button></div>
 <div class="card"><div class="lab">Mis calificaciones</div>${sent.length?sent.map(r=>{const p=find(r.person_id);return`<div class="rev" style="padding:8px 0;border-top:1px solid var(--line)"><small>${p?esc(p.name):'Usuario'} · ${REL[r.relation]} · ${r.stars}★</small>${r.comment_id!=null&&CM[r.comment_id]?`<p>“${esc(CM[r.comment_id][1])}”</p>`:''}</div>`}).join(''):'<p style="color:var(--mut);font-size:14px">Todavía no calificaste a nadie.</p>'}</div>
 <button class="btn" onclick="askRef()">${ic('share')} Pedir que me califiquen</button><button class="btn alt" onclick="shareApp()">Invitar amigos</button><button class="btn line" onclick="logout()">Cerrar sesión</button>`}

// ---------- MOTIVACIÓN: pedir referencias, progreso, gracias ----------
const profileLink=()=>location.origin+location.pathname+'?p='+U.id+'#app';
function askRef(wa){const x='¿Me dejás una referencia en Rankea Gente? Podés hacerlo anónimo y te toma 1 minuto 🙏',u=profileLink();
 try{localStorage.setItem('ref_asked','1')}catch(e){}
 if(navigator.share)navigator.share({title:'Rankea Gente',text:x,url:u}).then(()=>rr()).catch(()=>{});
 else window.open('https://wa.me/?text='+encodeURIComponent(x+' '+u),'_blank')}
function prog(){let asked=0;try{asked=localStorage.getItem('ref_asked')}catch(e){}
 const st=[['Entraste con Google',true],['Calificá a alguien',S.mine?S.mine.length>0:false],['Pedí que te califiquen',!!asked],['Escribí tu frase de perfil',!!(ME&&ME.trait)]],d=st.filter(x=>x[1]).length;
 if(d===4)return'';
 const nx=!st[1][1]?'<p class="nx">Tocá a cualquier persona de la lista y dejale tu estrella 👇</p>':!st[2][1]?'<button class="btn" onclick="askRef()">Pedir que me califiquen</button>':'<button class="btn alt" onclick="go(\'me\')">Escribir mi frase</button>';
 return`<div class="card prog"><div class="lab">Tus primeros pasos<span>${d}/4</span></div><div class="pbar"><i style="width:${d*25}%"></i></div>${st.map(x=>`<div class="st ${x[1]?'ok':''}"><span>${x[1]?'✓':'○'}</span>${x[0]}</div>`).join('')}${nx}</div>`}
function thanks(rated){const sug=PEOPLE.filter(p=>!rated.has(p.id)).sort((a,b)=>a.refs-b.refs).slice(0,3);
 const d=document.createElement('div');d.className='sheet';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div class="legalbox"><div class="lhead"><h3>¡Listo! Sumaste una referencia 🎉</h3><button class="round" onclick="this.closest('.sheet').remove()" aria-label="Cerrar">✕</button></div><div class="lbody"><p>Ahora te toca a vos: mientras más gente te califique, más completo queda tu perfil.</p><button class="btn" onclick="this.closest('.sheet').remove();askRef()">Pedir que me califiquen</button>${sug.length?'<h4 style="margin-top:16px">Calificá a otra persona</h4>'+sug.map(p=>`<button class="opt" onclick="this.closest('.sheet').remove();openPerson('${p.id}')">${esc(p.name)} <small style="color:var(--mut)">· ${p.refs?p.refs+' referencias':'sin referencias todavía'}</small></button>`).join(''):''}</div><button class="btn line" onclick="this.closest('.sheet').remove()">Seguir</button></div>`;
 document.body.appendChild(d)}

// ---------- BIENVENIDA ----------
function welcome(){let seen=0;try{seen=localStorage.getItem('ref_welcome')}catch(e){}if(seen)return'';
 return`<div class="card wel"><button class="x" onclick="closeWelcome()" aria-label="Cerrar">✕</button><b>👋 Así se usa</b><ol><li><b>Buscá</b> a alguien conocido.</li><li><b>Calificalo</b> con estrellas (podés ser anónimo).</li><li><b>Compartí</b> tu perfil desde la pestaña "Mi perfil".</li></ol></div>`}
function closeWelcome(){try{localStorage.setItem('ref_welcome','1')}catch(e){}rr()}

// Google bloquea el login dentro de estos navegadores (error "disallowed_useragent").
const UA=navigator.userAgent||'',IAB=/Instagram|FBAN|FBAV|FB_IAB|Messenger|TikTok|musical_ly|BytedanceWebview|Snapchat|LinkedInApp|Line\//i.test(UA),IS_AND=/Android/i.test(UA),IS_IOS=/iPhone|iPad|iPod/i.test(UA);let FORCE=false;
function openExt(){const u=location.origin+location.pathname;location.href='intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end'}
function copyLink(){const u=location.href.split('#')[0]+'#app';const ok=()=>toast('Enlace copiado. Pegalo en Chrome o Safari');try{navigator.clipboard.writeText(u).then(ok,()=>fb(u))}catch(e){fb(u)}}
function fb(u){const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Enlace copiado. Pegalo en Chrome o Safari')}catch(e){toast('No se pudo copiar')}t.remove()}

function iabBox(land){return`<div class="iab"><b>Abrilo en tu navegador para entrar</b>Google no permite iniciar sesión desde el navegador de Instagram.${IS_AND?'':`<ol><li>Tocá los <b style="display:inline">⋯</b> o el ícono de compartir (arriba o abajo a la derecha).</li><li>Elegí <b style="display:inline">“Abrir en el navegador”</b> o <b style="display:inline">“Abrir en Safari”</b>.</li></ol>`}<div class="row">${IS_AND?'<button onclick="openExt()">Abrir en Chrome</button>':''}<button class="${IS_AND?'sec':''}" onclick="copyLink()">Copiar enlace</button></div>${land?'':'<button class="try" onclick="tryHere()">Probar igual desde acá</button>'}</div>`}


try{const t=localStorage.getItem('ref_theme_v2');if(t)document.documentElement.dataset.theme=t}catch(e){}
addEventListener('hashchange',route);route();
