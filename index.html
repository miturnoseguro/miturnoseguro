<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerca · Chats de 15 minutos</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--b:#cfd3d6;--m:#667;--ink:#0f1419}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#fff;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:32px;margin:0 0 8px}h2{font-size:22px;margin:6px 0 10px}
.hint,.login p,small{color:var(--m)}
.login{text-align:center;padding-top:12vh}.login #gbox{display:flex;justify-content:center;margin:22px 0;min-height:44px}.login small{font-size:12px}
.card{display:flex;gap:12px;align-items:center;border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;background:#fff;cursor:pointer}
.card.me{cursor:default}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#e6e8ea}
.ph{display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ink)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px}.card small{font-size:13px}
.card p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.pill{border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 14px inherit;font-family:inherit;padding:9px 18px;cursor:pointer}
.pill.big{width:100%;padding:14px;font-size:15px;margin-top:10px}
.ghost{width:100%;border:1px solid var(--b);background:#fff;border-radius:999px;padding:12px;margin-top:8px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.ghost.sm{width:auto;margin:0;padding:6px 12px;font-size:18px}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin:8px 0 4px}
label{display:block;font-size:12px;font-weight:600;color:var(--m)}
input,select,textarea{width:100%;margin-top:4px;border:1px solid var(--b);border-radius:12px;padding:10px;font:500 15px inherit;font-family:inherit;color:var(--ink);background:#fff}
textarea{height:80px;resize:none}.age{display:flex;gap:4px}.profile label{margin-top:12px}
.banner{border:1px solid #f3d38a;background:#fff7e6;border-radius:16px;padding:12px;margin:10px 0;font-size:14px}.banner .pill{margin-top:8px}
.empty{text-align:center;color:var(--m);padding:40px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:14px 0;font:600 14px inherit;font-family:inherit;color:var(--m);position:relative;cursor:pointer}
.tabs .on{color:var(--ink);font-weight:800}
#dot{position:absolute;top:10px;margin-left:4px;width:8px;height:8px;border-radius:50%;background:#e0245e}.hid{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:50}
.sheet>div{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet.c{place-items:center;padding:16px}.sheet.c>div{border-radius:22px;max-width:420px;text-align:left}
.seg{display:flex;gap:6px;margin:6px 0 16px}.seg button{flex:1;border:1px solid var(--b);background:#fff;border-radius:999px;padding:11px 0;font:600 14px inherit;font-family:inherit;cursor:pointer}.seg .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .av{width:84px;height:84px;margin:0 auto 8px;font-size:32px}
.chat{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px));max-width:520px;margin:0 auto}
.chat header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b)}
.chat header .av{width:36px;height:36px}.chat header b{flex:1}.tm{font-weight:800;font-variant-numeric:tabular-nums}
.note{background:#f4f5f6;color:var(--m);font-size:12px;text-align:center;padding:8px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff}.bub.ot{align-self:flex-start;background:#eceef0}
.chat form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--b)}.chat form input{margin:0}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ====== CONFIG ======
const SB_URL='https://tiajsxobclpcumbhtntb.supabase.co',SB_KEY='sb_publishable_tQaZ_kq5QNT2LTImHSj3Lg_6m2mOnGi';
const GOOGLE_CLIENT_ID='962671080910-teo032pq4mrcp5b7av8k6q1j8741h90q.apps.googleusercontent.com';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}});
const G={mujer:'Mujer',hombre:'Hombre',otro:'Otro'};
let SG='',U=null,ME=null,PEOPLE=[],CHATS=[],F={min:18,max:99,g:'',r:''},V='home',C=null,MSGS=[],SEEN=new Set(),CH=null,HASLOC=false,UNREAD=false,TT;
const sel=(a,b)=>a==b?' selected':'';
const left=x=>Math.max(0,Math.floor((new Date(x)-Date.now())/1000)),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const nm=p=>esc(p.first_name||'Usuario')+(p.last_initial?' '+esc(p.last_initial)+'.':'');
const av=p=>p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" referrerpolicy="no-referrer" alt="">`:`<div class="av ph">${esc((p.first_name||'?')[0])}</div>`;
function toast(t){clearTimeout(TT);document.getElementById('toast')?.remove();const d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);TT=setTimeout(()=>d.remove(),3500)}

// ---------- AUTH (Google) ----------
const NONCE=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));let GREADY=false;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function onGoogle(r){const {error}=await sb.auth.signInWithIdToken({provider:'google',token:r.credential,nonce:NONCE});if(error)toast('No se pudo ingresar: '+error.message)}
async function mountGoogle(){const el=$('#gbox');if(!el)return;if(!(window.google&&google.accounts&&google.accounts.id))return setTimeout(mountGoogle,300);
 if(!GREADY){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogle,nonce:await sha(NONCE),auto_select:false});GREADY=true}
 google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'continue_with',locale:'es',width:320})}
async function logout(){try{google.accounts.id.disableAutoSelect()}catch(e){}try{await sb.auth.signOut()}catch(e){}boot(null)}

// ---------- DATOS ----------
async function loadMe(){const r=await sb.from('profiles').select('id,first_name,last_initial,avatar_url,age,gender,bio').eq('id',U.id).maybeSingle();ME=r.data||{}}
function getLoc(){return new Promise(res=>{if(!navigator.geolocation){HASLOC=false;return res(false)}
 navigator.geolocation.getCurrentPosition(async p=>{const r=await sb.rpc('set_my_location',{p_lat:p.coords.latitude,p_lng:p.coords.longitude});HASLOC=!r.error;res(HASLOC)},()=>{HASLOC=false;res(false)},{timeout:10000,maximumAge:600000})})}
async function loadPeople(){const r=await sb.rpc('nearby_profiles',{p_min_age:F.min,p_max_age:F.max,p_gender:F.g||null,p_radius_km:F.r?+F.r:null});
 if(r.error)toast('No se pudo cargar la gente');PEOPLE=r.error?[]:(r.data||[]);if(V==='home')drawList()}
async function loadChats(){const r=await sb.rpc('my_active_chats');CHATS=r.data||[];if(V==='chats')render()}
async function boot(s){
 if(s&&s.user){if(U&&U.id===s.user.id)return;U=s.user;await sb.rpc('init_my_profile');await loadMe();V='home';render();listen();
  if(ME.age&&ME.gender){await getLoc();loadChats();loadPeople();if(!HASLOC&&V==='home')render()}}
 else{U=ME=null;PEOPLE=[];CHATS=[];C=null;V='home';unlisten();render()}}
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>boot(s),0));

// ---------- REALTIME ----------
function listen(){unlisten();CH=sb.channel('inbox')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},p=>{if(p.new.user_b===U.id){loadChats();toast('Alguien quiere chatear con vos')}})
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;
  if(C&&C.chat_id===m.chat_id)addMsg(m);else if(m.sender_id!==U.id){UNREAD=true;$('#dot')?.classList.remove('hid');toast('Nuevo mensaje');loadChats()}}).subscribe()}
function unlisten(){if(CH){sb.removeChannel(CH);CH=null}}

// ---------- VISTAS ----------
function render(){const a=$('#app');
 if(!U){a.innerHTML=`<div class="wrap login"><h1>Cerca</h1><p>Conocé gente cerca tuyo. Chats de 15 minutos que desaparecen para siempre.</p><div id="gbox"></div><small>Solo mayores de 18 años. Al ingresar aceptás el <a href="descargo.html" target="_blank" rel="noopener">descargo de responsabilidad</a>.</small></div>`;return mountGoogle()}
 const need=!(ME&&ME.age&&ME.gender);if(need&&V!=='home')V='home';
 if(V==='chat'&&C)return renderChat();
 const body=V==='home'?homeHTML():V==='chats'?chatsHTML():profileHTML();
 a.innerHTML=`<div class="wrap">${body}</div>`+(need?'':`<nav class="tabs"><button class="${V==='home'?'on':''}" onclick="go('home')">Inicio</button><button class="${V==='chats'?'on':''}" onclick="go('chats')">Chats<i id="dot" class="${UNREAD?'':'hid'}"></i></button><button class="${V==='profile'?'on':''}" onclick="go('profile')">Perfil</button></nav>`);
 if(V==='home')drawList();if(need&&!$('#setup'))setup(true)}
function go(v){V=v;if(v==='chats'){UNREAD=false;loadChats()}render()}
function card(p,btn=true){return `<div class="card ${btn?'':'me'}" ${btn?`onclick="ask('${p.id}')"`:''}>${av(p)}<div class="t"><b>${nm(p)}</b><small>${p.age} · ${G[p.gender]||''}${p.distance_km?` · a ${p.distance_km} km`:''}</small></div>${btn?'<button class="pill">Chatear</button>':''}</div>`}
function homeHTML(){return `<h2>Cerca tuyo</h2>
${HASLOC?'':`<div class="banner">Activá tu ubicación para aparecer en el inicio y ver a qué distancia están los demás.<br><button class="pill" onclick="askLoc()">Permitir ubicación</button></div>`}
<div class="filters"><label>Edad<div class="age"><input id="fa" type="number" min="18" max="99" value="${F.min}" onchange="applyF()"><input id="fb" type="number" min="18" max="99" value="${F.max}" onchange="applyF()"></div></label>
<label>Sexo<select id="fg" onchange="applyF()"><option value="">Todos</option><option value="mujer"${sel(F.g,'mujer')}>Mujeres</option><option value="hombre"${sel(F.g,'hombre')}>Hombres</option><option value="otro"${sel(F.g,'otro')}>Otro</option></select></label>
<label>Distancia<select id="fr" onchange="applyF()">${[['','Cualquiera'],[5,'5 km'],[10,'10 km'],[25,'25 km'],[50,'50 km'],[100,'100 km']].map(o=>`<option value="${o[0]}"${sel(F.r,o[0])}>${o[1]}</option>`).join('')}</select></label></div>
<div id="list"></div>`}
function drawList(){const l=$('#list');if(l)l.innerHTML=PEOPLE.length?PEOPLE.map(p=>card(p)).join(''):'<div class="empty">No hay personas con estos filtros por ahora.</div>'}
function applyF(){F.min=Math.max(18,+$('#fa').value||18);F.max=Math.min(99,+$('#fb').value||99);F.g=$('#fg').value;F.r=$('#fr').value;loadPeople()}
async function askLoc(){if(await getLoc()){render();loadPeople()}else toast('Activá el permiso de ubicación en tu navegador')}
function chatsHTML(){return `<h2>Tus chats</h2>`+(CHATS.length?CHATS.map(c=>`<div class="card" onclick="openChat('${c.chat_id}')">${av(c)}<div class="t"><b>${nm(c)}</b><small>Termina en <span data-exp="${c.expires_at}">${fmt(left(c.expires_at))}</span></small></div><button class="pill">Abrir</button></div>`).join(''):'<div class="empty">No tenés chats activos. Tocá a alguien en el inicio para empezar uno.</div>')}
function profileHTML(){return `<h2>Tu perfil</h2><p class="hint">Así te ven los demás:</p>${card(ME,false)}<button class="pill big" onclick="setup(false)">Editar edad y sexo</button><button class="ghost" onclick="hideMe()">Dejar de aparecer (borrar mi ubicación)</button><button class="ghost" onclick="logout()">Salir</button>`}
function setup(first){const m=ME||{};SG=m.gender||'';$('#setup')?.remove();const d=document.createElement('div');d.id='setup';d.className='sheet c';if(!first)d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div><h2 style="margin-top:0">${first?'Un último paso':'Tus datos'}</h2><p class="hint" style="margin-top:0">Mostramos tu nombre (con la inicial del apellido) y tu foto de Google.</p>
<label>Edad</label><select id="pa" style="margin-bottom:16px"><option value="">Elegí tu edad…</option>${Array.from({length:82},(_,i)=>18+i).map(n=>`<option value="${n}"${sel(m.age,n)}>${n}</option>`).join('')}</select>
<label>Sexo</label><div class="seg">${[['mujer','Mujer'],['hombre','Hombre'],['otro','Otro']].map(o=>`<button type="button" data-g="${o[0]}" class="${SG===o[0]?'on':''}" onclick="pickG('${o[0]}')">${o[1]}</button>`).join('')}</div>
<button class="pill big" onclick="saveMe()">Continuar</button>${first?'<button class="ghost" onclick="logout()">Salir</button>':'<button class="ghost" onclick="this.closest(\'.sheet\').remove()">Cancelar</button>'}</div>`;document.body.appendChild(d)}
function pickG(g){SG=g;document.querySelectorAll('#setup .seg button').forEach(b=>b.classList.toggle('on',b.dataset.g===g))}
async function saveMe(){const age=+$('#pa').value,gender=SG;
 if(!(age>=18&&age<=99))return toast('Elegí tu edad');if(!gender)return toast('Elegí tu sexo');
 const r=await sb.rpc('save_my_profile',{p_age:age,p_gender:gender});if(r.error){console.error(r.error);return toast('Error: '+r.error.message)}
 $('#setup')?.remove();await loadMe();V='home';render();if(!HASLOC){await getLoc();render()}loadChats();loadPeople()}
async function hideMe(){await sb.rpc('clear_my_location');HASLOC=false;toast('Ya no aparecés en el inicio');render()}

// ---------- INICIAR CHAT ----------
function ask(id){const p=PEOPLE.find(x=>x.id===id);if(!p)return;const d=document.createElement('div');d.className='sheet';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div>${av(p)}<b style="font-size:18px">${nm(p)}</b><br><small>${p.age} · ${G[p.gender]||''}${p.distance_km?` · a ${p.distance_km} km`:''}</small>
 <p class="hint">Vas a poder chatear <b>15 minutos</b>. Después el chat se borra para siempre y no podrán volver a hablar.</p><button class="pill big" id="go">Empezar chat</button><button class="ghost" onclick="this.closest('.sheet').remove()">Cancelar</button></div>`;
 document.body.appendChild(d);$('#go').onclick=async()=>{$('#go').disabled=true;const r=await sb.rpc('start_chat',{p_other:id});d.remove();
  if(r.error){const m=r.error.message||'';toast(m.includes('already_chatted')?'Ya chatearon antes: no pueden volver a conectar.':'No se pudo iniciar el chat');return loadPeople()}
  await loadChats();PEOPLE=PEOPLE.filter(x=>x.id!==id);openChat(r.data)}}

// ---------- CHAT ----------
async function openChat(id){C=CHATS.find(c=>c.chat_id===id);if(!C)return;V='chat';MSGS=[];SEEN=new Set();renderChat();
 const r=await sb.from('messages').select('*').eq('chat_id',id).order('created_at');(r.data||[]).forEach(addMsg)}
function renderChat(){$('#app').innerHTML=`<div class="chat"><header><button class="ghost sm" onclick="leave()">‹</button>${av(C)}<b>${nm(C)}</b><span class="tm">⏱ <span data-exp="${C.expires_at}">${fmt(left(C.expires_at))}</span></span></header>
<div class="note">Este chat se borra al terminar el tiempo y no podrán volver a hablar.</div><div id="msgs"></div>
<form onsubmit="send(event);return false"><input id="mi" autocomplete="off" maxlength="1000" placeholder="Escribí un mensaje…"><button class="pill">Enviar</button></form></div>`;MSGS.forEach(m=>drawMsg(m))}
function drawMsg(m){const b=document.createElement('div');b.className='bub '+(m.sender_id===U.id?'me':'ot');b.textContent=m.body;const l=$('#msgs');if(l){l.appendChild(b);l.scrollTop=l.scrollHeight}}
function addMsg(m){if(SEEN.has(m.id))return;SEEN.add(m.id);MSGS.push(m);drawMsg(m)}
async function send(e){e.preventDefault();const t=$('#mi').value.trim();if(!t||!C)return;$('#mi').value='';
 const r=await sb.from('messages').insert({chat_id:C.chat_id,sender_id:U.id,body:t}).select().single();if(r.error)toast('No se pudo enviar (¿terminó el chat?)');else addMsg(r.data)}
function leave(){C=null;V='chats';loadChats();render()}
function endChat(){C=null;MSGS=[];SEEN=new Set();V='home';toast('El chat terminó y se borró para siempre');render();loadPeople()}

// ---------- RELOJ (cuenta regresiva de 15 min) ----------
setInterval(()=>{const now=Date.now();
 document.querySelectorAll('[data-exp]').forEach(e=>{e.textContent=fmt(left(e.dataset.exp))});
 if(C&&new Date(C.expires_at)<=now)return endChat();
 const n=CHATS.length;CHATS=CHATS.filter(c=>new Date(c.expires_at)>now);if(n!==CHATS.length&&V==='chats')render()},1000);

render();
</script>
</body>
</html>
