<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerca · Chats de 15 minutos</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--b:#cfd3d6;--m:#667;--ink:#0f1419}
*{box-sizing:border-box}html,body{margin:0;height:100%}
html,body{overscroll-behavior:none}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#fff;padding-top:env(safe-area-inset-top,0px)}
body.inchat{overflow:hidden;padding-top:0}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:32px;margin:0 0 8px}h2{font-size:22px;margin:6px 0 10px}
.hint,.login p,small{color:var(--m)}
.login{text-align:center;padding-top:12vh}.login #gbox{display:flex;justify-content:center;margin:22px 0;min-height:44px}.login small{font-size:12px}
.card{display:block;border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;background:#fff;cursor:pointer}
.card .row{display:flex;gap:12px;align-items:center}
.card.me{cursor:default}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#e6e8ea}
.ph{display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ink)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px}.card small{font-size:13px}
.card p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
/* miniaturas de fotos extra en cada tarjeta */
.thumbs{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.thumbs img{flex:0 1 64px;min-width:0;width:64px;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#e6e8ea;cursor:zoom-in}
.pill{border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:9px 18px;cursor:pointer}
.pill.big{width:100%;padding:14px;font-size:15px;margin-top:10px}
.ghost{width:100%;border:1px solid var(--b);background:#fff;border-radius:999px;padding:12px;margin-top:8px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.ghost.sm{width:auto;margin:0;padding:6px 12px;font-size:18px}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin:8px 0 4px}
.filters.g{grid-template-columns:1.3fr 1fr}
label{display:block;font-size:12px;font-weight:600;color:var(--m)}
/* font-size 16px evita el zoom automático de iOS al enfocar un campo */
input,select,textarea{width:100%;margin-top:4px;border:1px solid var(--b);border-radius:12px;padding:10px;font-family:inherit;font-weight:500;font-size:16px;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b)}
textarea{height:80px;resize:none}.age{display:flex;gap:4px}.profile label{margin-top:12px}
.banner{border:1px solid #f3d38a;background:#fff7e6;border-radius:16px;padding:12px;margin:10px 0;font-size:14px}.banner .pill{margin-top:8px}
.empty{text-align:center;color:var(--m);padding:40px 10px}
.promo{width:100%;display:block;border-radius:16px;margin:8px 0 6px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.bar b{font-size:20px}
.burger{position:relative;border:1px solid var(--b);background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
.sheet.m{place-items:stretch end}.sheet.m>div{width:240px;max-width:80vw;border-radius:0;padding:calc(18px + env(safe-area-inset-top,0px)) 8px 18px;text-align:left;overflow-y:auto}
.sheet.m button{display:block;width:100%;text-align:left;border:0;background:none;padding:16px 14px;font-family:inherit;font-weight:600;font-size:17px;border-radius:12px;cursor:pointer}.sheet.m .on{font-weight:800;background:#f1f2f3}
.sheet.m hr{border:0;border-top:1px solid var(--b);margin:8px 14px}
.dd{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0245e;margin-left:8px}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:8px;border-radius:11px;background:#e0245e;color:#fff;font-size:12px;font-weight:800;vertical-align:middle}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:14px 0;font-family:inherit;font-weight:600;font-size:14px;color:var(--m);position:relative;cursor:pointer}
.tabs .on{color:var(--ink);font-weight:800}
#dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#e0245e}.hid{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:50}
.sheet>div{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet.c{place-items:center;padding:16px}.sheet.c>div{border-radius:22px;max-width:420px;text-align:left}
.seg{display:flex;gap:6px;margin:6px 0 16px}.seg button{flex:1;border:1px solid var(--b);background:#fff;border-radius:999px;padding:11px 0;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}.seg .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .av{width:84px;height:84px;margin:0 auto 8px;font-size:32px}

/* ---- Fotos del perfil (editor) y visor ---- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pgrid .ph1{position:relative;aspect-ratio:1/1}
.pgrid .ph1 img{width:100%;height:100%;object-fit:cover;border-radius:14px;cursor:zoom-in;background:#e6e8ea}
.pgrid .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:17px;line-height:1;cursor:pointer;padding:0}
.pgrid .add{display:grid;place-items:center;aspect-ratio:1/1;border:2px dashed var(--b);border-radius:14px;font-size:30px;font-weight:500;color:var(--m);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:60;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:90vh;border-radius:12px}

/* ---- Chat: fijo y ajustado al viewport visual (el teclado de iPhone no tapa el botón) ---- */
.chat{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;height:var(--vh,100dvh);max-width:520px;margin:0 auto;background:#fff;padding-top:env(safe-area-inset-top,0px)}
.chat header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b)}
.chat header .av{width:36px;height:36px}.chat header b{flex:1}.tm{font-weight:800;font-variant-numeric:tabular-nums}
.note{background:#f4f5f6;color:var(--m);font-size:12px;text-align:center;padding:8px}
#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff}.bub.ot{align-self:flex-start;background:#eceef0}
.chat form{display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--b)}
.chat form input{margin:0;width:100%}
.chat form .pill{width:100%;padding:13px;font-size:15px}

/* ---- Burbujas flotantes de chats activos (inicio) ---- */
#fab{position:fixed;right:14px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:18px;z-index:40}
.fb{position:relative;width:60px;height:60px;border:0;padding:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
.fb .av{width:60px;height:60px;border:2px solid #fff;font-size:22px}
.fb .bd{position:absolute;top:-4px;right:-4px;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;border:2px solid #fff;background:#e0245e;color:#fff;font-style:normal;font-weight:800;font-size:12px}
.fb .ft{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}

#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ====== CONFIG ======
const SB_URL='https://tiajsxobclpcumbhtntb.supabase.co',SB_KEY='sb_publishable_tQaZ_kq5QNT2LTImHSj3Lg_6m2mOnGi';
const GOOGLE_CLIENT_ID='962671080910-teo032pq4mrcp5b7av8k6q1j8741h90q.apps.googleusercontent.com';
const MAXPH=6;
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}});
const G={mujer:'Mujer',hombre:'Hombre',otro:'Otro'};
let SG='',U=null,ME=null,PEOPLE=[],CHATS=[],F={min:18,max:60,g:'',r:''},V='home',C=null,MSGS=[],SEEN=new Set(),CH=null,HASLOC=false,UNREAD=false,UNR={},TT,PH={},MYPH=[],PEND=null;
const tot=()=>Object.values(UNR).reduce((a,b)=>a+b,0),hasUnr=()=>UNREAD||tot()>0;
const sel=(a,b)=>a==b?' selected':'';
const left=x=>Math.max(0,Math.floor((new Date(x)-Date.now())/1000)),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const nm=p=>esc(p.first_name||'Usuario')+(p.last_initial?' '+esc(p.last_initial)+'.':'');
const av=p=>p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" referrerpolicy="no-referrer" alt="">`:`<div class="av ph">${esc((p.first_name||'?')[0])}</div>`;
function toast(t,fn){clearTimeout(TT);document.getElementById('toast')?.remove();const d=document.createElement('div');d.id='toast';d.textContent=t;if(fn){d.style.cursor='pointer';d.onclick=()=>{d.remove();fn()}}document.body.appendChild(d);TT=setTimeout(()=>d.remove(),3500)}

// ---------- AUTH (Google) ----------
const NONCE=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));let GREADY=false;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function onGoogle(r){const {error}=await sb.auth.signInWithIdToken({provider:'google',token:r.credential,nonce:NONCE});if(error)toast('No se pudo ingresar: '+error.message)}
async function mountGoogle(){const el=$('#gbox');if(!el)return;if(!(window.google&&google.accounts&&google.accounts.id))return setTimeout(mountGoogle,300);
 if(!GREADY){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogle,nonce:await sha(NONCE),auto_select:false});GREADY=true}
 google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'continue_with',locale:'es',width:280})}
async function logout(){try{google.accounts.id.disableAutoSelect()}catch(e){}try{await sb.auth.signOut()}catch(e){}boot(null)}

// Ventana de ingreso: solo aparece cuando alguien sin sesión intenta chatear (o toca "Ingresar")
function loginSheet(){$('#login')?.remove();const d=document.createElement('div');d.id='login';d.className='sheet c';d.onclick=e=>{if(e.target===d){PEND=null;d.remove()}};
 d.innerHTML=`<div style="text-align:center"><h2 style="margin-top:0">Ingresá para chatear</h2><p class="hint" style="margin-top:0">Es gratis. Los chats duran 15 minutos y desaparecen para siempre.</p><div id="gbox" style="display:flex;justify-content:center;margin:18px 0;min-height:44px"></div><small>Solo mayores de 18 años. Al ingresar aceptás el <a href="descargo.html" target="_blank" rel="noopener">descargo de responsabilidad</a>.</small><button class="ghost" onclick="PEND=null;this.closest('.sheet').remove()">Ahora no</button></div>`;
 document.body.appendChild(d);mountGoogle()}
// Después de ingresar, retoma el chat que la persona quería iniciar
function resumePending(){if(!PEND)return;const id=PEND;PEND=null;if(ME&&ME.age&&ME.gender&&PEOPLE.find(x=>x.id===id))ask(id)}

// ---------- DATOS ----------
async function loadMe(){const r=await sb.from('profiles').select('id,first_name,last_initial,avatar_url,age,gender,bio').eq('id',U.id).maybeSingle();ME=r.data||{}}
function getLoc(){return new Promise(res=>{if(!navigator.geolocation){HASLOC=false;return res(false)}
 navigator.geolocation.getCurrentPosition(async p=>{const r=await sb.rpc('set_my_location',{p_lat:p.coords.latitude,p_lng:p.coords.longitude});if(r.error){console.error(r.error);toast('Error al guardar ubicación: '+r.error.message)}HASLOC=!r.error;res(HASLOC)},e=>{HASLOC=false;toast('No pudimos obtener tu ubicación: '+e.message);res(false)},{timeout:10000,maximumAge:600000})})}
// Fotos extra de varias personas (para las miniaturas de las tarjetas)
async function loadPhotos(ids){if(!ids.length)return;const r=await sb.from('profile_photos').select('user_id,url').in('user_id',ids).order('created_at');if(r.error){console.error(r.error);return}
 const m={};(r.data||[]).forEach(x=>(m[x.user_id]=m[x.user_id]||[]).push(x.url));ids.forEach(i=>PH[i]=m[i]||[]);if(U&&MYPH.length)PH[U.id]=MYPH.map(x=>x.url)}
async function loadMyPhotos(){const r=await sb.from('profile_photos').select('id,url,path').eq('user_id',U.id).order('created_at');MYPH=r.data||[];PH[U.id]=MYPH.map(x=>x.url)}
// Con sesión usa nearby_profiles (con distancia); sin sesión usa public_profiles (sin distancia)
async function loadPeople(){const r=U?await sb.rpc('nearby_profiles',{p_min_age:F.min,p_max_age:F.max,p_gender:F.g||null,p_radius_km:F.r?+F.r:null}):await sb.rpc('public_profiles',{p_min_age:F.min,p_max_age:F.max,p_gender:F.g||null});
 if(r.error){console.error(r.error);toast('Error al cargar gente: '+r.error.message)}PEOPLE=r.error?[]:(r.data||[]);await loadPhotos(PEOPLE.map(p=>p.id));if(V==='home')drawList()}
async function loadChats(){const r=await sb.rpc('my_active_chats');CHATS=r.data||[];if(V==='chats')render();else if(V==='home')bubbles()}
async function boot(s){
 if(s&&s.user){if(U&&U.id===s.user.id)return;U=s.user;$('#login')?.remove();{const ri=await sb.rpc('init_my_profile');if(ri.error){console.error(ri.error);toast('Error de perfil: '+ri.error.message)}}await loadMe();await loadMyPhotos();V='home';render();listen();
  if(ME.age&&ME.gender){await getLoc();loadChats();await loadPeople();if(!HASLOC&&V==='home')render();resumePending()}}
 else{U=ME=null;PEOPLE=[];CHATS=[];UNR={};UNREAD=false;MYPH=[];C=null;V='home';unlisten();render();loadPeople()}}
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>boot(s),0));

// ---------- REALTIME ----------
function listen(){unlisten();CH=sb.channel('inbox')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},async p=>{if(p.new.user_b!==U.id)return;await loadChats();
  const c=CHATS.find(x=>x.chat_id===p.new.id)||{};BADGE++;title();UNREAD=true;$('#dot')?.classList.remove('hid');alertUser('👋 '+(who(c)||'Alguien')+' quiere chatear','Tenés 15 minutos',p.new.id)})
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(C&&C.chat_id===m.chat_id)addMsg(m);if(m.sender_id!==U.id)incoming(m)}).subscribe()}
function unlisten(){if(CH){sb.removeChannel(CH);CH=null}}

// ---------- VISTAS ----------
function render(){const a=$('#app');$('#fab')?.remove();document.body.classList.remove('inchat');
 if(!U){a.innerHTML=`<div class="wrap"><div class="bar"><b>Cerca</b><button class="pill" onclick="loginSheet()">Ingresar</button></div>${homeHTML()}<p class="hint" style="font-size:12px;text-align:center;margin-top:18px">Solo mayores de 18 años. <a href="descargo.html" target="_blank" rel="noopener">Descargo de responsabilidad</a>.</p></div>`;drawList();return}
 const need=!(ME&&ME.age&&ME.gender);if(need&&V!=='home')V='home';
 if(V==='chat'&&C)return renderChat();
 const body=V==='home'?homeHTML():V==='chats'?chatsHTML():profileHTML();
 a.innerHTML=`<div class="wrap">${need?'':bar()}${body}</div>`;
 if(V==='home')drawList();bubbles();if(need&&!$('#setup'))setup(true)}
function bar(){return `<div class="bar"><b>Cerca</b><button class="burger" onclick="menu()" aria-label="Menú">☰<i id="dot" class="${hasUnr()?'':'hid'}"></i></button></div>`}
function menu(){$('#menu')?.remove();const d=document.createElement('div');d.id='menu';d.className='sheet m';d.onclick=e=>{if(e.target===d)d.remove()};
 const t=tot(),badge=o=>o[0]==='chats'?(t?`<span class="cnt">${t}</span>`:UNREAD?'<i class="dd"></i>':''):'';
 const live=CHATS.length?'<hr>'+CHATS.map(c=>`<button onclick="pickChat('${c.chat_id}')">💬 ${nm(c)}${UNR[c.chat_id]?`<span class="cnt">${UNR[c.chat_id]}</span>`:''}</button>`).join(''):'';
 d.innerHTML=`<div>${[['home','Inicio'],['chats','Chats'],['profile','Perfil']].map(o=>`<button class="${V===o[0]?'on':''}" onclick="pick('${o[0]}')">${o[1]}${badge(o)}</button>`).join('')}${live}<hr><button onclick="this.closest('.sheet').remove();logout()">Cerrar sesión</button></div>`;document.body.appendChild(d)}
function pick(v){$('#menu')?.remove();go(v)}
function pickChat(id){$('#menu')?.remove();openChat(id)}
function go(v){V=v;if(v==='chats'){UNREAD=false;clr();loadChats()}render()}
function thumbs(p){const ph=PH[p.id]||[];return ph.length?`<div class="thumbs">${ph.map(u=>`<img src="${esc(u)}" loading="lazy" alt="" onclick="event.stopPropagation();zoom(this.src)">`).join('')}</div>`:''}
function zoom(u){const d=document.createElement('div');d.className='lb';d.onclick=()=>d.remove();d.innerHTML=`<img src="${esc(u)}" alt="">`;document.body.appendChild(d)}
function card(p,btn=true){return `<div class="card ${btn?'':'me'}" ${btn?`onclick="ask('${p.id}')"`:''}><div class="row">${av(p)}<div class="t"><b>${nm(p)}</b><small>${p.age} · ${G[p.gender]||''}${p.distance_km?` · a ${p.distance_km} km`:''}</small></div>${btn?'<button class="pill">Chatear</button>':''}</div>${thumbs(p)}</div>`}
function homeHTML(){return `<img class="promo" src="banner.jpg" alt="Multiplica conexiones" onerror="this.remove()"><div class="bar" style="margin:0"><h2 style="margin:6px 0">Cerca tuyo</h2><button class="burger" style="width:auto;padding:0 12px;font-weight:600;font-size:14px;font-family:inherit" onclick="loadPeople();toast('Actualizado')">↻ Actualizar</button></div>
${U&&!HASLOC?`<div class="banner">Activá tu ubicación para aparecer en el inicio y ver a qué distancia están los demás.<br><button class="pill" onclick="askLoc()">Permitir ubicación</button></div>`:''}
${U?notifBanner():''}<div class="filters${U?'':' g'}"><label>Edad<div class="age"><input id="fa" type="number" min="18" max="60" value="${F.min}" onchange="applyF()"><input id="fb" type="number" min="18" max="60" value="${F.max}" onchange="applyF()"></div></label>
<label>Sexo<select id="fg" onchange="applyF()"><option value="">Todos</option><option value="mujer"${sel(F.g,'mujer')}>Mujeres</option><option value="hombre"${sel(F.g,'hombre')}>Hombres</option><option value="otro"${sel(F.g,'otro')}>Otro</option></select></label>
${U?`<label>Distancia<select id="fr" onchange="applyF()">${[['','Cualquiera'],[5,'5 km'],[10,'10 km'],[25,'25 km'],[50,'50 km'],[100,'100 km']].map(o=>`<option value="${o[0]}"${sel(F.r,o[0])}>${o[1]}</option>`).join('')}</select></label>`:''}</div>
<div id="list"></div>`}
function drawList(){const l=$('#list');if(l)l.innerHTML=PEOPLE.length?PEOPLE.map(p=>card(p)).join(''):'<div class="empty">No hay personas por ahora. Para aparecer, cada persona tiene que completar su perfil y permitir la ubicación.</div>'}
// burbujas flotantes: una por chat activo, con contador de mensajes sin leer
function bubbles(){$('#fab')?.remove();if(!U||V!=='home'||!CHATS.length)return;const d=document.createElement('div');d.id='fab';
 d.innerHTML=CHATS.map(c=>{const n=UNR[c.chat_id]||0;return `<button class="fb" onclick="openChat('${c.chat_id}')" aria-label="Chat con ${esc(c.first_name||'usuario')}">${av(c)}${n?`<i class="bd">${n>9?'9+':n}</i>`:''}<span class="ft" data-exp="${c.expires_at}">${fmt(left(c.expires_at))}</span></button>`}).join('');document.body.appendChild(d)}
function applyF(){F.min=Math.max(18,+$('#fa').value||18);F.max=Math.min(60,+$('#fb').value||60);F.g=$('#fg').value;F.r=$('#fr')?$('#fr').value:'';loadPeople()}
async function askLoc(){if(await getLoc()){render();loadPeople()}else toast('Activá el permiso de ubicación en tu navegador')}
function chatsHTML(){return `<h2>Tus chats</h2>`+(CHATS.length?CHATS.map(c=>`<div class="card" onclick="openChat('${c.chat_id}')"><div class="row">${av(c)}<div class="t"><b>${nm(c)}${UNR[c.chat_id]?`<span class="cnt">${UNR[c.chat_id]}</span>`:''}</b><small>Termina en <span data-exp="${c.expires_at}">${fmt(left(c.expires_at))}</span></small></div><button class="pill">Abrir</button></div></div>`).join(''):'<div class="empty">No tenés chats activos. Tocá a alguien en el inicio para empezar uno.</div>')}
function profileHTML(){return `<h2>Tu perfil</h2><p class="hint">Así te ven los demás:</p>${card(ME,false)}
<div class="bar" style="margin:18px 0 0"><b style="font-size:16px">Tus fotos</b><small>${MYPH.length}/${MAXPH}</small></div>
<div class="pgrid">${MYPH.map(f=>`<div class="ph1"><img src="${esc(f.url)}" alt="" onclick="zoom(this.src)"><button class="x" onclick="delPhoto('${f.id}')" aria-label="Borrar foto">×</button></div>`).join('')}${MYPH.length<MAXPH?`<label class="add">＋<input type="file" accept="image/*" hidden onchange="addPhoto(this)"></label>`:''}</div>
<button class="pill big" onclick="setup(false)">Editar edad y sexo</button><button class="ghost" onclick="hideMe()">Dejar de aparecer (borrar mi ubicación)</button><button class="ghost" onclick="logout()">Salir</button>`}

// ---------- FOTOS EXTRA ----------
// Reduce la foto a máx. 900px y la convierte a JPEG antes de subirla
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('imagen no válida'))};im.src=u})}
async function addPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(MYPH.length>=MAXPH)return toast('Máximo '+MAXPH+' fotos');toast('Subiendo foto…');
 try{const blob=await shrink(f),path=U.id+'/'+Date.now()+'.jpg';
  const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
  const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
  const ins=await sb.from('profile_photos').insert({user_id:U.id,url,path});if(ins.error){await sb.storage.from('photos').remove([path]);throw ins.error}
  await loadMyPhotos();if(V==='profile')render();toast('Foto agregada')}
 catch(e){console.error(e);toast('No se pudo subir la foto')}}
async function delPhoto(id){const f=MYPH.find(x=>x.id===id);if(!f||!confirm('¿Borrar esta foto?'))return;
 const r=await sb.from('profile_photos').delete().eq('id',id);if(r.error){console.error(r.error);return toast('No se pudo borrar la foto')}
 await sb.storage.from('photos').remove([f.path]);await loadMyPhotos();if(V==='profile')render()}

function setup(first){const m=ME||{};SG=m.gender||'';$('#setup')?.remove();const d=document.createElement('div');d.id='setup';d.className='sheet c';if(!first)d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div><h2 style="margin-top:0">${first?'Un último paso':'Tus datos'}</h2><p class="hint" style="margin-top:0">Mostramos tu nombre (con la inicial del apellido) y tu foto de Google.</p>
<label>Edad</label><select id="pa" style="margin-bottom:16px"><option value="">Elegí tu edad…</option>${Array.from({length:43},(_,i)=>18+i).map(n=>`<option value="${n}"${sel(m.age,n)}>${n}</option>`).join('')}</select>
<label>Sexo</label><div class="seg">${[['mujer','Mujer'],['hombre','Hombre'],['otro','Otro']].map(o=>`<button type="button" data-g="${o[0]}" class="${SG===o[0]?'on':''}" onclick="pickG('${o[0]}')">${o[1]}</button>`).join('')}</div>
<button class="pill big" onclick="saveMe()">Continuar</button>${first?'<button class="ghost" onclick="logout()">Salir</button>':'<button class="ghost" onclick="this.closest(\'.sheet\').remove()">Cancelar</button>'}</div>`;document.body.appendChild(d)}
function pickG(g){SG=g;document.querySelectorAll('#setup .seg button').forEach(b=>b.classList.toggle('on',b.dataset.g===g))}
async function saveMe(){const age=+$('#pa').value,gender=SG;
 if(!(age>=18&&age<=99))return toast('Elegí tu edad');if(!gender)return toast('Elegí tu sexo');
 const r=await sb.rpc('save_my_profile',{p_age:age,p_gender:gender});if(r.error){console.error(r.error);return toast('Error: '+r.error.message)}
 $('#setup')?.remove();await loadMe();V='home';render();if(!HASLOC){await getLoc();render()}loadChats();await loadPeople();resumePending()}
async function hideMe(){await sb.rpc('clear_my_location');HASLOC=false;toast('Ya no aparecés en el inicio');render()}

// ---------- INICIAR CHAT ----------
function ask(id){const p=PEOPLE.find(x=>x.id===id);if(!p)return;
 if(!U){PEND=id;return loginSheet()} // sin sesión: pedir ingreso recién acá
 const d=document.createElement('div');d.className='sheet';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div>${av(p)}<b style="font-size:18px">${nm(p)}</b><br><small>${p.age} · ${G[p.gender]||''}${p.distance_km?` · a ${p.distance_km} km`:''}</small>
 <p class="hint">Vas a poder chatear <b>15 minutos</b>. Después el chat se borra para siempre y no podrán volver a hablar.</p><button class="pill big" id="go">Empezar chat</button><button class="ghost" onclick="this.closest('.sheet').remove()">Cancelar</button></div>`;
 document.body.appendChild(d);$('#go').onclick=async()=>{$('#go').disabled=true;const r=await sb.rpc('start_chat',{p_other:id});d.remove();
  if(r.error){const m=r.error.message||'';toast(m.includes('already_chatted')?'Ya chatearon antes: no pueden volver a conectar.':'No se pudo iniciar el chat');return loadPeople()}
  await loadChats();PEOPLE=PEOPLE.filter(x=>x.id!==id);openChat(r.data)}}

// ---------- CHAT ----------
async function openChat(id){clr();C=CHATS.find(c=>c.chat_id===id);if(!C)return;delete UNR[id];V='chat';MSGS=[];SEEN=new Set();renderChat();
 const r=await sb.from('messages').select('*').eq('chat_id',id).order('created_at');(r.data||[]).forEach(addMsg)}
function renderChat(){$('#fab')?.remove();document.body.classList.add('inchat');
 $('#app').innerHTML=`<div class="chat"><header><button class="ghost sm" onclick="leave()">‹</button>${av(C)}<b>${nm(C)}</b><span class="tm">⏱ <span data-exp="${C.expires_at}">${fmt(left(C.expires_at))}</span></span></header>
<div class="note">Este chat se borra al terminar el tiempo y no podrán volver a hablar.</div><div id="msgs"></div>
<form onsubmit="send(event);return false"><input id="mi" autocomplete="off" maxlength="1000" enterkeyhint="send" placeholder="Escribí un mensaje…"><button class="pill">Enviar</button></form></div>`;vv();MSGS.forEach(m=>drawMsg(m))}
function drawMsg(m){const b=document.createElement('div');b.className='bub '+(m.sender_id===U.id?'me':'ot');b.textContent=m.body;const l=$('#msgs');if(l){l.appendChild(b);l.scrollTop=l.scrollHeight}}
function addMsg(m){if(SEEN.has(m.id))return;SEEN.add(m.id);MSGS.push(m);drawMsg(m)}
async function send(e){e.preventDefault();const t=$('#mi').value.trim();if(!t||!C)return;$('#mi').value='';$('#mi').focus();
 const r=await sb.from('messages').insert({chat_id:C.chat_id,sender_id:U.id,body:t}).select().single();if(r.error)toast('No se pudo enviar (¿terminó el chat?)');else addMsg(r.data)}
function leave(){C=null;V='chats';loadChats();render()}
function endChat(){C=null;MSGS=[];SEEN=new Set();V='home';toast('El chat terminó y se borró para siempre');render();loadPeople()}

// Ajusta el chat al viewport visual: con el teclado abierto en iPhone el campo y el botón Enviar quedan visibles
function vv(){const v=window.visualViewport;if(!v)return;document.documentElement.style.setProperty('--vh',v.height+'px');
 const c=$('.chat');if(c){c.style.transform='translateY('+v.offsetTop+'px)';const l=$('#msgs');if(l)l.scrollTop=l.scrollHeight}}
if(window.visualViewport){visualViewport.addEventListener('resize',vv);visualViewport.addEventListener('scroll',vv)}
vv();

// ---------- AVISOS (notificaciones, sonido, vibración, contador) ----------
let BADGE=0,AC;
const who=c=>c.first_name?c.first_name+(c.last_initial?' '+c.last_initial+'.':''):'';
const title=()=>{document.title=(BADGE?'('+BADGE+') ':'')+'Cerca · Chats de 15 minutos'};
const clr=()=>{BADGE=0;title()};
const seen=()=>{if(V==='chat'&&C)delete UNR[C.chat_id]};
document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function beep(){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.25)}catch(e){}}
async function openChatId(id){if(!CHATS.find(c=>c.chat_id===id))await loadChats();openChat(id)}
async function incoming(m){if(!CHATS.find(c=>c.chat_id===m.chat_id))await loadChats();
 const c=CHATS.find(x=>x.chat_id===m.chat_id)||{};
 if(C&&C.chat_id===m.chat_id&&!document.hidden&&document.hasFocus())return;
 UNR[m.chat_id]=(UNR[m.chat_id]||0)+1;
 BADGE++;title();UNREAD=true;$('#dot')?.classList.remove('hid');
 if(V==='home')bubbles();else if(V==='chats')render();
 alertUser('💬 '+(who(c)||'Nuevo mensaje'),m.body.slice(0,90),m.chat_id)}
function alertUser(t,b,id){beep();try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
 if(document.hidden||!document.hasFocus())sysNotify(t,b,id);else toast(t+(b?' · '+b:''),()=>openChatId(id))}
async function sysNotify(t,b,id){if(!('Notification' in window)||Notification.permission!=='granted')return;
 const o={body:b,tag:'chat-'+id,renotify:true,icon:'favicon.png',badge:'favicon.png',data:{chat:id},vibrate:[120,60,120]};
 try{const reg=navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null;if(reg)return reg.showNotification(t,o);
  const n=new Notification(t,o);n.onclick=()=>{window.focus();openChatId(id);n.close()}}catch(e){console.warn(e)}}
function askNotif(){Notification.requestPermission().then(p=>{render();toast(p==='granted'?'Avisos activados 🔔':'Avisos bloqueados: podés activarlos en los ajustes del sitio')})}
const notifBanner=()=>('Notification' in window&&Notification.permission==='default')?`<div class="banner">🔔 Activá los avisos para enterarte cuando alguien te escriba, aunque estés en otra pestaña.<br><button class="pill" onclick="askNotif()">Activar avisos</button></div>`:'';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.chat)openChatId(e.data.chat)})}
addEventListener('focus',()=>{if(V==='chat'||V==='chats')clr();seen()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(V==='chat'||V==='chats'))clr();if(!document.hidden)seen()});

// ---------- RELOJ (cuenta regresiva de 15 min) ----------
setInterval(()=>{const now=Date.now();
 document.querySelectorAll('[data-exp]').forEach(e=>{e.textContent=fmt(left(e.dataset.exp))});
 if(C&&new Date(C.expires_at)<=now)return endChat();
 const n=CHATS.length;CHATS=CHATS.filter(c=>new Date(c.expires_at)>now);
 if(n!==CHATS.length){Object.keys(UNR).forEach(k=>{if(!CHATS.find(c=>c.chat_id===k))delete UNR[k]});if(V==='chats')render();else if(V==='home')bubbles()}},1000);

// Refresco de la lista cada 20 s (también sin sesión)
setInterval(()=>{if(V==='home'&&(!U||(ME&&ME.age)))loadPeople()},20000);
render();
</script>
</body>
</html>
